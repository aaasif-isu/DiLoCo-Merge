[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = ".", "tplr" = "src/tplr"}

[tool.setuptools.packages.find]
where   = [".", "src"]
include = ["models*", "data*", "methods*", "training*", "evaluation*", "tplr*"]

[project]
name = "isoloco"
version = "0.1.0"
description = "Modular research framework for model-merging aggregation strategies in DiLoCo (IsoLoCo)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "transformers",
    "datasets",
    "numpy",
    "einops",
    "pip",
    "pyyaml",
    "wandb",
    "psutil",
    "accelerate",
    "tqdm",
    "rich>=13.0.0",
    "python-logging-loki>=0.3.1",
    "uvloop>=0.21.0",
    "setuptools"
]


[tool.uv]
prerelease = "allow"

[tool.ruff]
# Exclude directories that often trigger permission issues
exclude = [
    ".git",
    "venv",
    ".venv",
    "build",
    "dist",
    "__pycache__",
    "downloads",
    "eggs",
    ".eggs",
]
