# IsoLoCo (isoloco) — 178M Llama Chinchilla-Budget (3.55B DCLM Tokens) Configuration
# Target: 1 A100 GPU, 4 virtual workers, H=30 local steps, 225 outer synchronization rounds
# - Model: 178M Llama (177,622,016 parameters, 9 layers, 1024 hidden, 8 heads, 2688 SwiGLU MLP, seq_len 2048)
# - Dataset: mlfoundations/dclm-baseline-1.0-parquet tokenized with togethercomputer/LLaMA-2-7B-32K
# - Token budget: 3,552,440,320 training tokens (20x Chinchilla budget = 888,110,080 tokens/worker)
# - Global batch size: 524,288 tokens/inner step (4 workers * 64 sequences/worker * 2048 seq_len)
# - Gradient accumulation: batch_size=64, micro_batch_size=16 (4 micro-steps/inner step; ~26-28 GiB peak VRAM on 1 A100)
# - Outer rounds: 3,552,440,320 // (4 * 30 * 64 * 2048) = 225 outer rounds (6,750 inner steps/worker; 660 warmup steps)
# - Inner optimizer: AdamW (lr=0.00138, beta1=0.9, beta2=0.95, weight_decay=0.1, 10% linear warmup + cosine decay)
# - Outer optimizer: ISOCLoCo (lr=1.8, momentum=0.8, nesterov=True, orthogonalize_object="gradient")

experiment:
  run_name: dclm_178m_isoloco_iid_w4_h30_r225_s42
  run_id: chinchilla_w4_h30_r225_s42
  project: isoloco_178M_main
  seed: 42
  log_wandb: true
  debug: false
  trace: false

dataset:
  key: dclm
  name: mlfoundations/dclm-baseline-1.0-parquet
  revision: 817d6752765f6a41261085171dd546b104f60626
  split_manifest: /lustre/hdd/LAS/jannesar-lab/aaasif/datasets/dclm_100m/source_splits.json
  shards_path: /lustre/hdd/LAS/jannesar-lab/aaasif/datasets/dclm_178m_3p55b
  shard_token_size: 1073741824       # 1024^3 tokens (~1.07B tokens) per .npy shard
  token_budget: 3552440320           # 20 * 177,622,016 parameters = 3,552,440,320 training tokens
  val_tokens: 104857600              # 100 * 1024^2 tokens (~100M held-out validation tokens)
  test_tokens: 0
  val_split: 0.05
  test_split: 0.05
  buffer_size: 10000
  sequence_length: 2048
  languages: null
  pin_data_to_gpu: false

partitioning:
  strategy: iid
  partition_file: /lustre/hdd/LAS/jannesar-lab/aaasif/datasets/dclm_178m_3p55b/partitions_train_iid_w4.json
  save_partitions: true
  eval_partition_file: /lustre/hdd/LAS/jannesar-lab/aaasif/datasets/dclm_178m_3p55b/partitions_valid_iid_w4.json

model:
  architecture: llama
  size: 178M
  hparams_file: models/configs/178M_model_hparams.json
  tokenizer_name: togethercomputer/LLaMA-2-7B-32K
  tokenizer_revision: 46c24bb5aef59722fa7aa6d75e832afd1d64b980
  use_compile: true
  torchtitan_init: false

workers:
  num_workers: 4                     # 4 virtual workers on 1 physical A100 GPU
  virtual_workers: 4

training:
  inner_outer_strategy: diloco
  inner_steps: 30
  batch_size: 64                     # 64 sequences/worker * 4 workers * 2048 = 524,288 global tokens/step
  micro_batch_size: 16               # 4 gradient-accumulation micro-steps per inner step
  max_steps: -1                      # Auto-computed from token_budget: 3,552,440,320 // 15,728,640 = 225 outer rounds

inner_optimizer:
  type: adamw
  learning_rate: 0.00138
  beta2: 0.95
  weight_decay: 0.1
  warmup_steps: 0.1

method:
  name: isoloco
  strategy: isoloco
  outer_optimizer: isocloco
  learning_rate: 1.8
  momentum: 0.8
  nesterov: true
  weight_decay: 0.0
  use_outer_scheduler: false
  outer_warmup_steps: null
  isoc_orthogonalize_object: gradient
  isoc_exclude_keys:
    - embed_tokens
    - lm_head

evaluation:
  eval_frequency: 25                 # Evaluates every 25 outer rounds (windows 24, 49, ..., 224)
  val_token_budget: 104857600        # 100 * 1024^2 validation tokens (~100M tokens)
  per_worker_eval: false

checkpointing:
  save_path: /lustre/hdd/LAS/jannesar-lab/aaasif/diloco_merge/outputs/dclm_178m_isoloco_iid_w4_h30_r225_s42
  checkpoint_frequency: 75
  load_checkpoint: null
  resume_from_checkpoint: false
  save_final_diagnostics: false

