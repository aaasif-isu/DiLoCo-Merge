# IsoLoCo (Iso-C with Nesterov Momentum) — 512M model, 8 workers (H=30)
experiment:
  run_name: isoloco_512m_r8
  project: isoloco_512M_main

dataset:
  token_budget: 10247976960

model:
  size: 512M
  hparams_file: models/configs/512M_model_hparams.json

workers:
  num_workers: 8

training:
  inner_steps: 30
  batch_size: 128
  micro_batch_size: 8

inner_optimizer:
  type: adamw
  learning_rate: 0.00138
  beta2: 0.95
  weight_decay: 0.1
  warmup_steps: 0.1

method:
  strategy: isoloco
  outer_optimizer: isocloco
  learning_rate: 1.8
  momentum: 0.8
  nesterov: true
  isoc_orthogonalize_object: gradient
