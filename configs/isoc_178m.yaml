# Iso-C (without outer momentum) — 178M model, 8 workers (H=30)
experiment:
  run_name: isoc_178m_r8
  project: isoloco_178M_main

model:
  size: 178M
  hparams_file: models/configs/178M_model_hparams.json

workers:
  num_workers: 8

training:
  inner_steps: 30
  batch_size: 32
  micro_batch_size: 32

inner_optimizer:
  type: adamw
  learning_rate: 0.00391
  beta2: 0.95
  weight_decay: 0.1
  warmup_steps: 0.1

method:
  strategy: isocloco
  outer_optimizer: isocloco
  learning_rate: 2.1
  momentum: 0.0
  nesterov: false
