  tokenizer_revision: 46c24bb5aef59722fa7aa6d75e832afd1d64b980
  use_compile: true
  torchtitan_init: false

workers:
  num_workers: 4
  virtual_workers: 4

training:
  inner_outer_strategy: diloco
  inner_steps: 30
  batch_size: 8
  micro_batch_size: 8
  max_steps: 100

inner_optimizer:
  type: adamw
  learning_rate: 0.003
  beta2: 0.95
  weight_decay: 0.1
  warmup_steps: 0.1

method:
  name: soft_signal_iso
  strategy: soft_signal_iso
  outer_optimizer: soft_signal_iso
  learning_rate: 1.5
  momentum: 0.8
  nesterov: true
  weight_decay: 0.0
  use_outer_scheduler: false
  outer_warmup_steps: null
  isoc_orthogonalize_object: gradient
  isoc_exclude_keys:
    - embed_tokens
    - wpe
    - lm_head

evaluation:
  eval_frequency: 10
  val_token_budget: 2000000
  per_worker_eval: true

checkpointing:
  save_path: /lustre/hdd/LAS/jannesar-lab/aaasif/diloco_merge/outputs/mc4_15m_soft_signal_iso_iid_w4_h30_r100_s42
