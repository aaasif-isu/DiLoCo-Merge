# Soft Signal-Selective IsoLoCo (soft_signal_iso) — mC4 15M IID Configuration
# Copied from the Signal-Iso 15M IID configuration; changes only method and run/output identifiers.

experiment:
  run_name: mc4_15m_soft_signal_iso_iid_w4_h30_r100_s42
  run_id: null
  project: diloco_merge_mc4_15m
  seed: 42
  log_wandb: true
  debug: false
  trace: false

dataset:
  key: mc4
  name: allenai/c4
  revision: 1588ec454efa1a09f29cd18ddd04fe05fc8653a2
  shards_path: /lustre/hdd/LAS/jannesar-lab/aaasif/datasets/mc4_15m_multilingual
  shard_token_size: 12288000
  token_budget: 12288000
  val_tokens: 2000000
  test_tokens: 2000000
  buffer_size: 10000
  sequence_length: 128
  languages:
    - en
    - fr
    - de
    - es
  pin_data_to_gpu: false

partitioning:
  strategy: iid
  partition_file: null
  save_partitions: true
  eval_partition_file: null

model:
  architecture: tinygpt
  size: 15M
  hparams_file: models/configs/15M_model_hparams.json
